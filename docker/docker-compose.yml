version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kas_sekolah_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: kas_root_password
      MYSQL_DATABASE: kas_sekolah_db
      MYSQL_USER: kas_user
      MYSQL_PASSWORD: kas_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kas_user", "-pkas_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kas_sekolah_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
